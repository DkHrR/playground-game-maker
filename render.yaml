services:
  - type: web
    name: playground-game-maker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from tinker_cookbook import tokenizer_utils; tokenizer_utils.get_tokenizer('Qwen/Qwen3-8B')"
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 180 --bind 0.0.0.0:$PORT
    envVars:
      - key: PROVIDER
        value: tinker
      - key: MODEL
        value: Qwen/Qwen3-8B
      - key: MOCK_MODEL
        value: "0"
      - key: DEMO_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: API_KEY
        sync: false
      - key: DEMO_TOKEN
        sync: false
