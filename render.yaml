services:
  - type: web
    name: playground-game-maker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    envVars:
      - key: PROVIDER
        value: tinker
      - key: MODEL
        value: Qwen/Qwen3-8B
      - key: MOCK_MODEL
        value: "0"
      - key: DEMO_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_KEY
        sync: false
      - key: DEMO_TOKEN
        sync: false
